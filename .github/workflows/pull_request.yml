name: GitHub Actions Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Lint
      - name: Run ESLint
        run: npm run lint

      # Type check
      - name: Run TypeScript check
        run: npm run typecheck
